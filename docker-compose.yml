services:
  api:
    build: .
    container_name: taskflow-api
    command: npm run dev
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/taskflow
    volumes:
      - ./src:/app/src
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: taskflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: